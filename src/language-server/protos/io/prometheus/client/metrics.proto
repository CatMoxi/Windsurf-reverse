syntax = "proto3";

package io.prometheus.client;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/prometheus/client_model/go;io_prometheus_client";

enum MetricType {
  COUNTER = 0;
  GAUGE = 1;
  SUMMARY = 2;
  UNTYPED = 3;
  HISTOGRAM = 4;
  GAUGE_HISTOGRAM = 5;
}

message LabelPair {
  string name = 1;
  string value = 2;
}

message Gauge {
  double value = 1;
}

message Counter {
  double value = 1;
  io.prometheus.client.Exemplar exemplar = 2;
  google.protobuf.Timestamp created_timestamp = 3;
}

message Quantile {
  double quantile = 1;
  double value = 2;
}

message Summary {
  uint64 sample_count = 1;
  double sample_sum = 2;
  repeated io.prometheus.client.Quantile quantile = 3;
  google.protobuf.Timestamp created_timestamp = 4;
}

message Untyped {
  double value = 1;
}

message Histogram {
  uint64 sample_count = 1;
  double sample_count_float = 4;
  double sample_sum = 2;
  repeated io.prometheus.client.Bucket bucket = 3;
  google.protobuf.Timestamp created_timestamp = 15;
  sint32 schema = 5;
  double zero_threshold = 6;
  uint64 zero_count = 7;
  double zero_count_float = 8;
  repeated io.prometheus.client.BucketSpan negative_span = 9;
  repeated sint64 negative_delta = 10;
  repeated double negative_count = 11;
  repeated io.prometheus.client.BucketSpan positive_span = 12;
  repeated sint64 positive_delta = 13;
  repeated double positive_count = 14;
  repeated io.prometheus.client.Exemplar exemplars = 16;
}

message Bucket {
  uint64 cumulative_count = 1;
  double cumulative_count_float = 4;
  double upper_bound = 2;
  io.prometheus.client.Exemplar exemplar = 3;
}

message BucketSpan {
  sint32 offset = 1;
  uint32 length = 2;
}

message Exemplar {
  repeated io.prometheus.client.LabelPair label = 1;
  double value = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message Metric {
  repeated io.prometheus.client.LabelPair label = 1;
  io.prometheus.client.Gauge gauge = 2;
  io.prometheus.client.Counter counter = 3;
  io.prometheus.client.Summary summary = 4;
  io.prometheus.client.Untyped untyped = 5;
  io.prometheus.client.Histogram histogram = 7;
  int64 timestamp_ms = 6;
}

message MetricFamily {
  string name = 1;
  string help = 2;
  io.prometheus.client.MetricType type = 3;
  repeated io.prometheus.client.Metric metric = 4;
  string unit = 5;
}

