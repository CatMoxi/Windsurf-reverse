syntax = "proto3";

package buf.validate;

import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/bufbuild/protovalidate/protocolbuffers/go/buf/validate";

enum Ignore {
  IGNORE_UNSPECIFIED = 0;
  IGNORE_IF_UNPOPULATED = 1;
  IGNORE_IF_DEFAULT_VALUE = 2;
  IGNORE_ALWAYS = 3;
}

enum KnownRegex {
  KNOWN_REGEX_UNSPECIFIED = 0;
  KNOWN_REGEX_HTTP_HEADER_NAME = 1;
  KNOWN_REGEX_HTTP_HEADER_VALUE = 2;
}

message Rule {
  string id = 1;
  string message = 2;
  string expression = 3;
}

message MessageRules {
  bool disabled = 1;
  repeated buf.validate.Rule cel = 3;
}

message OneofRules {
  bool required = 1;
}

message FieldRules {
  oneof type {
    buf.validate.FloatRules float = 1;
    buf.validate.DoubleRules double = 2;
    buf.validate.Int32Rules int32 = 3;
    buf.validate.Int64Rules int64 = 4;
    buf.validate.UInt32Rules uint32 = 5;
    buf.validate.UInt64Rules uint64 = 6;
    buf.validate.SInt32Rules sint32 = 7;
    buf.validate.SInt64Rules sint64 = 8;
    buf.validate.Fixed32Rules fixed32 = 9;
    buf.validate.Fixed64Rules fixed64 = 10;
    buf.validate.SFixed32Rules sfixed32 = 11;
    buf.validate.SFixed64Rules sfixed64 = 12;
    buf.validate.BoolRules bool = 13;
    buf.validate.StringRules string = 14;
    buf.validate.BytesRules bytes = 15;
    buf.validate.EnumRules enum = 16;
    buf.validate.RepeatedRules repeated = 18;
    buf.validate.MapRules map = 19;
    buf.validate.AnyRules any = 20;
    buf.validate.DurationRules duration = 21;
    buf.validate.TimestampRules timestamp = 22;
  }
  repeated buf.validate.Rule cel = 23;
  bool required = 25;
  buf.validate.Ignore ignore = 27;
}

message PredefinedRules {
  repeated buf.validate.Rule cel = 1;
}

message FloatRules {
  oneof less_than {
    float lt = 2;
    float lte = 3;
  }
  oneof greater_than {
    float gt = 4;
    float gte = 5;
  }
  float const = 1;
  repeated float in = 6;
  repeated float not_in = 7;
  bool finite = 8;
  repeated float example = 9;
}

message DoubleRules {
  oneof less_than {
    double lt = 2;
    double lte = 3;
  }
  oneof greater_than {
    double gt = 4;
    double gte = 5;
  }
  double const = 1;
  repeated double in = 6;
  repeated double not_in = 7;
  bool finite = 8;
  repeated double example = 9;
}

message Int32Rules {
  oneof less_than {
    int32 lt = 2;
    int32 lte = 3;
  }
  oneof greater_than {
    int32 gt = 4;
    int32 gte = 5;
  }
  int32 const = 1;
  repeated int32 in = 6;
  repeated int32 not_in = 7;
  repeated int32 example = 8;
}

message Int64Rules {
  oneof less_than {
    int64 lt = 2;
    int64 lte = 3;
  }
  oneof greater_than {
    int64 gt = 4;
    int64 gte = 5;
  }
  int64 const = 1;
  repeated int64 in = 6;
  repeated int64 not_in = 7;
  repeated int64 example = 9;
}

message UInt32Rules {
  oneof less_than {
    uint32 lt = 2;
    uint32 lte = 3;
  }
  oneof greater_than {
    uint32 gt = 4;
    uint32 gte = 5;
  }
  uint32 const = 1;
  repeated uint32 in = 6;
  repeated uint32 not_in = 7;
  repeated uint32 example = 8;
}

message UInt64Rules {
  oneof less_than {
    uint64 lt = 2;
    uint64 lte = 3;
  }
  oneof greater_than {
    uint64 gt = 4;
    uint64 gte = 5;
  }
  uint64 const = 1;
  repeated uint64 in = 6;
  repeated uint64 not_in = 7;
  repeated uint64 example = 8;
}

message SInt32Rules {
  oneof less_than {
    sint32 lt = 2;
    sint32 lte = 3;
  }
  oneof greater_than {
    sint32 gt = 4;
    sint32 gte = 5;
  }
  sint32 const = 1;
  repeated sint32 in = 6;
  repeated sint32 not_in = 7;
  repeated sint32 example = 8;
}

message SInt64Rules {
  oneof less_than {
    sint64 lt = 2;
    sint64 lte = 3;
  }
  oneof greater_than {
    sint64 gt = 4;
    sint64 gte = 5;
  }
  sint64 const = 1;
  repeated sint64 in = 6;
  repeated sint64 not_in = 7;
  repeated sint64 example = 8;
}

message Fixed32Rules {
  oneof less_than {
    fixed32 lt = 2;
    fixed32 lte = 3;
  }
  oneof greater_than {
    fixed32 gt = 4;
    fixed32 gte = 5;
  }
  fixed32 const = 1;
  repeated fixed32 in = 6;
  repeated fixed32 not_in = 7;
  repeated fixed32 example = 8;
}

message Fixed64Rules {
  oneof less_than {
    fixed64 lt = 2;
    fixed64 lte = 3;
  }
  oneof greater_than {
    fixed64 gt = 4;
    fixed64 gte = 5;
  }
  fixed64 const = 1;
  repeated fixed64 in = 6;
  repeated fixed64 not_in = 7;
  repeated fixed64 example = 8;
}

message SFixed32Rules {
  oneof less_than {
    sfixed32 lt = 2;
    sfixed32 lte = 3;
  }
  oneof greater_than {
    sfixed32 gt = 4;
    sfixed32 gte = 5;
  }
  sfixed32 const = 1;
  repeated sfixed32 in = 6;
  repeated sfixed32 not_in = 7;
  repeated sfixed32 example = 8;
}

message SFixed64Rules {
  oneof less_than {
    sfixed64 lt = 2;
    sfixed64 lte = 3;
  }
  oneof greater_than {
    sfixed64 gt = 4;
    sfixed64 gte = 5;
  }
  sfixed64 const = 1;
  repeated sfixed64 in = 6;
  repeated sfixed64 not_in = 7;
  repeated sfixed64 example = 8;
}

message BoolRules {
  bool const = 1;
  repeated bool example = 2;
}

message StringRules {
  oneof well_known {
    bool email = 12;
    bool hostname = 13;
    bool ip = 14;
    bool ipv4 = 15;
    bool ipv6 = 16;
    bool uri = 17;
    bool uri_ref = 18;
    bool address = 21;
    bool uuid = 22;
    bool tuuid = 33;
    bool ip_with_prefixlen = 26;
    bool ipv4_with_prefixlen = 27;
    bool ipv6_with_prefixlen = 28;
    bool ip_prefix = 29;
    bool ipv4_prefix = 30;
    bool ipv6_prefix = 31;
    bool host_and_port = 32;
    buf.validate.KnownRegex well_known_regex = 24;
  }
  string const = 1;
  uint64 len = 19;
  uint64 min_len = 2;
  uint64 max_len = 3;
  uint64 len_bytes = 20;
  uint64 min_bytes = 4;
  uint64 max_bytes = 5;
  string pattern = 6;
  string prefix = 7;
  string suffix = 8;
  string contains = 9;
  string not_contains = 23;
  repeated string in = 10;
  repeated string not_in = 11;
  bool strict = 25;
  repeated string example = 34;
}

message BytesRules {
  oneof well_known {
    bool ip = 10;
    bool ipv4 = 11;
    bool ipv6 = 12;
  }
  bytes const = 1;
  uint64 len = 13;
  uint64 min_len = 2;
  uint64 max_len = 3;
  string pattern = 4;
  bytes prefix = 5;
  bytes suffix = 6;
  bytes contains = 7;
  repeated bytes in = 8;
  repeated bytes not_in = 9;
  repeated bytes example = 14;
}

message EnumRules {
  int32 const = 1;
  bool defined_only = 2;
  repeated int32 in = 3;
  repeated int32 not_in = 4;
  repeated int32 example = 5;
}

message RepeatedRules {
  uint64 min_items = 1;
  uint64 max_items = 2;
  bool unique = 3;
  buf.validate.FieldRules items = 4;
}

message MapRules {
  uint64 min_pairs = 1;
  uint64 max_pairs = 2;
  buf.validate.FieldRules keys = 4;
  buf.validate.FieldRules values = 5;
}

message AnyRules {
  repeated string in = 2;
  repeated string not_in = 3;
}

message DurationRules {
  oneof less_than {
    google.protobuf.Duration lt = 3;
    google.protobuf.Duration lte = 4;
  }
  oneof greater_than {
    google.protobuf.Duration gt = 5;
    google.protobuf.Duration gte = 6;
  }
  google.protobuf.Duration const = 2;
  repeated google.protobuf.Duration in = 7;
  repeated google.protobuf.Duration not_in = 8;
  repeated google.protobuf.Duration example = 9;
}

message TimestampRules {
  oneof less_than {
    google.protobuf.Timestamp lt = 3;
    google.protobuf.Timestamp lte = 4;
    bool lt_now = 7;
  }
  oneof greater_than {
    google.protobuf.Timestamp gt = 5;
    google.protobuf.Timestamp gte = 6;
    bool gt_now = 8;
  }
  google.protobuf.Timestamp const = 2;
  google.protobuf.Duration within = 9;
  repeated google.protobuf.Timestamp example = 10;
}

message Violations {
  repeated buf.validate.Violation violations = 1;
}

message Violation {
  buf.validate.FieldPath field = 5;
  buf.validate.FieldPath rule = 6;
  string rule_id = 2;
  string message = 3;
  bool for_key = 4;
}

message FieldPath {
  repeated buf.validate.FieldPathElement elements = 1;
}

message FieldPathElement {
  oneof subscript {
    uint64 index = 6;
    bool bool_key = 7;
    int64 int_key = 8;
    uint64 uint_key = 9;
    string string_key = 10;
  }
  int32 field_number = 1;
  string field_name = 2;
  google.protobuf.FieldDescriptorProto.Type field_type = 3;
  google.protobuf.FieldDescriptorProto.Type key_type = 4;
  google.protobuf.FieldDescriptorProto.Type value_type = 5;
}

